{% extends "base.html" %}
{% block content %}
<section class="section" style="max-width: 450px; margin: 40px auto;">
  <h2>Reset Password</h2>
  <p>Enter your registered name and email to set a new password.</p>

  <form method="POST" style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
    <div>
      <label>Registered Name</label>
      <input type="text" name="name" placeholder="Enter the name you registered with" required>
    </div>

    <div>
      <label>Registered Email</label>
      <input type="email" name="email" placeholder="Enter your registered email" required>
    </div>

    <div>
      <label>New Password</label>
      <input type="password" name="new_password" minlength="6" placeholder="Enter new password (min 6 chars)" required>
    </div>

    <button type="submit" class="btn">Reset Password</button>
  </form>

  <p style="margin-top: 15px;"><a href="{{ url_for('login') }}">Back to Login</a></p>
  <p style="margin-top: 10px;"><a href="{{ url_for('forgot_password') }}">Forgot Password?</a></p>
</section>
{% endblock %}
