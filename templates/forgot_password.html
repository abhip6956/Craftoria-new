{% extends "base.html" %}
{% block title %}Reset password | Craftoria.love{% endblock %}
{% block content %}
<section class="form-section"><form class="form-card" method="post">
  <p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password</h1>
  <p class="muted">Enter your registered name and email to set a new password.</p>
  <label>Registered name<input type="text" name="name" placeholder="Enter the name you registered with" required maxlength="100" autocomplete="name"></label>
  <label>Registered email address<input type="email" name="email" placeholder="Enter your registered email" required autocomplete="email"></label>
  <label>New password (at least 6 characters)<input type="password" name="new_password" placeholder="Enter new password (min 6 chars)" required minlength="6" autocomplete="new-password"></label>
  <button class="btn" type="submit">Reset password</button>
  <p class="muted">Remembered it? <a href="{{ url_for('login') }}">Back to log in</a></p>
</form></section>
{% endblock %}
