{% extends "base.html" %}
{% block title %}Edit product | Craftoria.love{% endblock %}
{% block content %}
<section class="form-section"><form class="form-card" method="post">
  <p class="eyebrow">STORE CONTROL</p><h1>Edit product</h1>
  <label>Product name<input name="name" value="{{ product.name }}" required></label>
  <label>Price in ₹<input type="number" name="price" min="1" step="0.01" value="{{ product.price }}" required></label>
  <label>Description<textarea name="description" rows="4">{{ product.description }}</textarea></label>
  <label>Image Path / URL<input type="text" name="image" value="{{ product.image }}"></label>
  <button class="btn" type="submit">Save changes</button><a class="text-link" href="{{ url_for('manager') }}">Cancel</a>
</form></section>
{% endblock %}
